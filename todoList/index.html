<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Tarefas</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <div class="task-app">
            <h2>Task List 
                <img src="img/lista-de-tarefas.png" alt="">
            </h2>
            <div class="row">
                <input type="text" name="task" id="task" placeholder="Digite o nome da tarefa">
                <button id="btnAdd">Adicionar</button>
            </div>
            <!-- ^ Lista de Tarefas = O JS adicionará novas tarefas pelo botão -->
            <ul id="task-list">
                <li class="checked">Tarefa 1</li>
                <li>Tarefa 2</li>
            </ul>
        </div>
    </div>
    <script src="js/script.js"></script>
</body>
</html>
